name: Audit

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - 'rakit*'
      - 'rustc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Pruning and script audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Check the pruned tree
        run: python3 .github/scripts/audit_tree.py
      - name: Compile helper scripts
        run: |
          python3 -m py_compile \
            .github/scripts/audit_tree.py \
            .github/scripts/smoke_test.py \
            .github/scripts/target_smoke.py \
            .github/scripts/check_compiler_rt.py \
            .github/scripts/check_rustc_wrapper.py
      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import pathlib, yaml
          for path in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              yaml.safe_load(path.read_text())
              print(f'{path}: ok')
          PY
