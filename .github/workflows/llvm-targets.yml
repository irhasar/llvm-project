name: LLVM targets

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - 'rakit*'
      - 'rustc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  target:
    name: Build and smoke ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'X86 and AArch64', targets: 'X86;AArch64', experimental: '', smoke: 'X86 AArch64' }
          - { name: 'ARM and RISCV', targets: 'ARM;RISCV', experimental: '', smoke: 'ARM RISCV' }
          - { name: 'AMDGPU and NVPTX', targets: 'AMDGPU;NVPTX', experimental: '', smoke: 'AMDGPU NVPTX' }
          - { name: 'BPF and Hexagon', targets: 'BPF;Hexagon', experimental: '', smoke: 'BPF Hexagon' }
          - { name: 'LoongArch and Mips', targets: 'LoongArch;Mips', experimental: '', smoke: 'LoongArch Mips' }
          - { name: 'MSP430 and AVR', targets: 'MSP430', experimental: 'AVR', smoke: 'MSP430 AVR' }
          - { name: 'M68k and CSKY', targets: 'X86', experimental: 'M68k;CSKY', smoke: 'M68k CSKY' }
          - { name: 'PowerPC and Xtensa', targets: 'PowerPC', experimental: 'Xtensa', smoke: 'PowerPC Xtensa' }
          - { name: 'Sparc and SystemZ', targets: 'Sparc;SystemZ', experimental: '', smoke: 'Sparc SystemZ' }
          - { name: 'WebAssembly', targets: 'WebAssembly', experimental: '', smoke: 'WebAssembly' }
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build
      - name: Configure one backend
        env:
          LLVM_TARGETS: ${{ matrix.targets }}
          LLVM_EXPERIMENTAL_TARGETS: ${{ matrix.experimental }}
        run: |
          cmake -S llvm -B build -G Ninja \
            -DLLVM_ENABLE_PROJECTS= \
            -DLLVM_TARGETS_TO_BUILD="${LLVM_TARGETS}" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD="${LLVM_EXPERIMENTAL_TARGETS}" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_Z3_SOLVER=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_INSTALL_UTILS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
      - name: Build target tools
        run: cmake --build build --target llc llvm-config llvm-readobj llvm-objdump -j 4
      - name: Smoke test the backends
        env:
          SMOKE_TARGETS: ${{ matrix.smoke }}
        run: |
          set -f
          for target in ${SMOKE_TARGETS}; do
            python3 .github/scripts/target_smoke.py --build-dir build --target "${target}"
          done
