name: LLVM targets

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - 'rakit*'
      - 'rustc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  target:
    name: Build and smoke ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: AArch64, targets: AArch64, experimental: '' }
          - { target: AMDGPU, targets: AMDGPU, experimental: '' }
          - { target: ARM, targets: ARM, experimental: '' }
          - { target: BPF, targets: BPF, experimental: '' }
          - { target: Hexagon, targets: Hexagon, experimental: '' }
          - { target: LoongArch, targets: LoongArch, experimental: '' }
          - { target: MSP430, targets: MSP430, experimental: '' }
          - { target: Mips, targets: Mips, experimental: '' }
          - { target: NVPTX, targets: NVPTX, experimental: '' }
          - { target: PowerPC, targets: PowerPC, experimental: '' }
          - { target: RISCV, targets: RISCV, experimental: '' }
          - { target: Sparc, targets: Sparc, experimental: '' }
          - { target: SystemZ, targets: SystemZ, experimental: '' }
          - { target: WebAssembly, targets: WebAssembly, experimental: '' }
          - { target: X86, targets: X86, experimental: '' }
          - { target: AVR, targets: X86, experimental: AVR }
          - { target: M68k, targets: X86, experimental: M68k }
          - { target: CSKY, targets: X86, experimental: CSKY }
          - { target: Xtensa, targets: X86, experimental: Xtensa }
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build
      - name: Configure one backend
        env:
          LLVM_TARGETS: ${{ matrix.targets }}
          LLVM_EXPERIMENTAL_TARGETS: ${{ matrix.experimental }}
        run: |
          cmake -S llvm -B build -G Ninja \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TARGETS_TO_BUILD="${LLVM_TARGETS}" \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD="${LLVM_EXPERIMENTAL_TARGETS}" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_Z3_SOLVER=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_INSTALL_UTILS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
      - name: Build target tools
        run: cmake --build build --target llc llvm-config llvm-readobj llvm-objdump lld -j 4
      - name: Smoke test the backend
        run: python3 .github/scripts/target_smoke.py --build-dir build --target "${{ matrix.target }}"
