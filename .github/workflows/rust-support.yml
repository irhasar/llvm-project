name: Rust Support Ports

on:
  push:
    branches:
      - rakit-0.1.0-rc1
  pull_request:
    paths:
      - 'llvm/lib/Support/rust/**'
      - 'llvm/lib/Support/CRC.cpp'
      - 'llvm/lib/Support/MD5.cpp'
      - 'llvm/lib/Support/SHA1.cpp'
      - 'llvm/lib/Support/SHA256.cpp'
      - 'llvm/lib/Support/SipHash.cpp'
      - 'llvm/lib/Support/CMakeLists.txt'
      - 'llvm/CMakeLists.txt'
      - 'llvm/cmake/modules/AddRustLibrary.cmake'
      - 'llvm/lib/Target/X86/X86FixupLEAs.cpp'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-support.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
      - name: fmt, clippy and unit tests
        run: |
          for crate in siphash crc md5 sha1 sha256; do
            echo "::group::$crate"
            (cd "llvm/lib/Support/rust/$crate" \
              && cargo fmt --check \
              && cargo clippy --all-targets -- -D warnings \
              && cargo test)
            echo "::endgroup::"
          done

  build:
    name: Build (${{ matrix.backend }} backend)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cpp, rust]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev
      - name: Install Rust
        if: matrix.backend == 'rust'
        run: |
          rustup toolchain install --profile minimal
          rustc --version
      - name: Configure
        run: |
          RUST_FLAGS=""
          if [ "${{ matrix.backend }}" = "rust" ]; then
            RUST_FLAGS="-DLLVM_ENABLE_RUST_SIPHASH=ON -DLLVM_ENABLE_RUST_CRC=ON -DLLVM_ENABLE_RUST_MD5=ON -DLLVM_ENABLE_RUST_SHA1=ON -DLLVM_ENABLE_RUST_SHA256=ON"
          fi
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=host \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            $RUST_FLAGS
      - name: Build LLVMSupport
        run: ninja -C build LLVMSupport
      - name: Golden tests
        run: |
          ninja -C build llvm-siphash-stable-hash llvm-crc-stable llvm-md5-stable \
            llvm-sha1-stable llvm-sha256-stable
          ./build/bin/llvm-siphash-stable-hash
          ./build/bin/llvm-crc-stable
          ./build/bin/llvm-md5-stable
          ./build/bin/llvm-sha1-stable
          ./build/bin/llvm-sha256-stable
      - name: Differential checks
        if: matrix.backend == 'rust'
        run: |
          ninja -C build check-llvm-rust-siphash check-llvm-rust-crc \
            check-llvm-rust-md5 check-llvm-rust-sha1 check-llvm-rust-sha256

  codegen-lea:
    name: LEA fold (llc)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: llvm-ccache-${{ github.sha }}
          restore-keys: llvm-ccache-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev ccache
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal
          rustc --version
      - name: Configure
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_CCACHE_BUILD=ON
      - name: Build llc
        run: ninja -C build llc
      - name: Emit MD5 IR
        run: |
          set -euo pipefail
          cd llvm/lib/Support/rust/md5
          RUSTFLAGS="-C lto=no -C target-cpu=generic" \
            cargo rustc --release -- --emit=llvm-ir
          IR="$(find target -name '*.ll' | head -n 1)"
          test -n "$IR"
          echo "IR=$PWD/$IR" >> "$GITHUB_ENV"
      - name: Compare instruction counts
        run: |
          set -euo pipefail
          build/bin/llc -O3 -mcpu=x86-64 "$IR" -o /tmp/base.s
          build/bin/llc -O3 -mcpu=x86-64 -x86-fold-add-into-lea "$IR" \
            -o /tmp/fold.s
          base=$(grep -cE '^[[:space:]]+add' /tmp/base.s || true)
          fold=$(grep -cE '^[[:space:]]+add' /tmp/fold.s || true)
          lea_base=$(grep -cE '^[[:space:]]+lea' /tmp/base.s || true)
          lea_fold=$(grep -cE '^[[:space:]]+lea' /tmp/fold.s || true)
          echo "add: base=$base folded=$fold"
          echo "lea: base=$lea_base folded=$lea_fold"
          if ! test "$fold" -lt "$base"; then
            echo "no fold applied; first lea/add lines of the baseline:"
            grep -nE '^[[:space:]]+(lea|add)' /tmp/base.s | head -n 40
            exit 1
          fi
      - name: Upload asm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lea-asm
          path: |
            /tmp/base.s
            /tmp/fold.s
