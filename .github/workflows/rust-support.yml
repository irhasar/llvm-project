name: Rust Support Ports

on:
  push:
    branches:
      - rakit-0.1.0-rc1
  pull_request:
    paths:
      - 'llvm/lib/Support/rust/**'
      - 'llvm/lib/Support/CRC.cpp'
      - 'llvm/lib/Support/MD5.cpp'
      - 'llvm/lib/Support/SipHash.cpp'
      - 'llvm/lib/Support/CMakeLists.txt'
      - 'llvm/CMakeLists.txt'
      - 'llvm/cmake/modules/AddRustLibrary.cmake'
      - '.github/workflows/rust-support.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
      - name: fmt, clippy and unit tests
        run: |
          for crate in siphash crc md5; do
            echo "::group::$crate"
            (cd "llvm/lib/Support/rust/$crate" \
              && cargo fmt --check \
              && cargo clippy --all-targets -- -D warnings \
              && cargo test)
            echo "::endgroup::"
          done

  build:
    name: Build (${{ matrix.backend }} backend)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cpp, rust]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev
      - name: Install Rust
        if: matrix.backend == 'rust'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Configure
        run: |
          RUST_FLAGS=""
          if [ "${{ matrix.backend }}" = "rust" ]; then
            RUST_FLAGS="-DLLVM_ENABLE_RUST_SIPHASH=ON -DLLVM_ENABLE_RUST_CRC=ON -DLLVM_ENABLE_RUST_MD5=ON"
          fi
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=host \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            $RUST_FLAGS
      - name: Build LLVMSupport
        run: ninja -C build LLVMSupport
      - name: Golden tests
        run: |
          ninja -C build llvm-siphash-stable-hash llvm-crc-stable llvm-md5-stable
          ./build/bin/llvm-siphash-stable-hash
          ./build/bin/llvm-crc-stable
          ./build/bin/llvm-md5-stable
      - name: Differential checks
        if: matrix.backend == 'rust'
        run: |
          ninja -C build check-llvm-rust-siphash check-llvm-rust-crc check-llvm-rust-md5
