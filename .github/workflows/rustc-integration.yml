name: Rustc integration

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - 'rakit*'
    paths:
      - '.github/workflows/rustc-integration.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "quick builds rustc_llvm only; full also builds std and runs codegen tests"
        type: choice
        options:
          - quick
          - full
        default: quick
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Build and test rustc_llvm (nightly)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'quick')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pruned LLVM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          path: llvm-project
      - name: Checkout rustc
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rust-lang/rust
          ref: main
          fetch-depth: 1
          submodules: true
          path: rust
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build zlib1g-dev libzstd-dev \
            pkg-config libssl-dev
      - name: Vendor this tree as rustc's src/llvm-project
        run: |
          rm -rf rust/src/llvm-project
          cp -a llvm-project rust/src/llvm-project
          rm -rf rust/src/llvm-project/.git
      - name: Configure rustc to build LLVM, LLD and compiler-rt from source
        run: |
          cat > rust/bootstrap.toml <<'EOF'
          [build]
          submodules = false
          optimized-compiler-builtins = true

          [llvm]
          download-ci-llvm = false
          assertions = true

          [rust]
          download-rustc = false
          lld = true
          EOF
          cat rust/bootstrap.toml
      - name: Build rustc_llvm only
        run: |
          cd rust
          ./x.py build --stage 1 --jobs 4 compiler/rustc_llvm
      - name: Test rustc_llvm bindings
        run: |
          cd rust
          ./x.py test --stage 1 compiler/rustc_llvm --no-fail-fast

  full-build:
    name: Build stage 1 rustc (full)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pruned LLVM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          path: llvm-project
      - name: Checkout rustc
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rust-lang/rust
          ref: main
          fetch-depth: 1
          submodules: true
          path: rust
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build zlib1g-dev libzstd-dev \
            pkg-config libssl-dev
      - name: Vendor this tree as rustc's src/llvm-project
        run: |
          rm -rf rust/src/llvm-project
          cp -a llvm-project rust/src/llvm-project
          rm -rf rust/src/llvm-project/.git
      - name: Configure rustc to build LLVM, LLD and compiler-rt from source
        run: |
          cat > rust/bootstrap.toml <<'EOF'
          [build]
          submodules = false
          optimized-compiler-builtins = true

          [llvm]
          download-ci-llvm = false
          assertions = true

          [rust]
          download-rustc = false
          lld = true
          EOF
          cat rust/bootstrap.toml
      - name: Build stage 1 rustc and std
        run: |
          cd rust
          ./x.py build --stage 1 --jobs 8
      - name: Upload stage 1 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rustc-stage1
          path: |
            rust/build/host/stage0*
            rust/build/host/stage1*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  full-codegen:
    name: Run codegen tests (full)
    needs: full-build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pruned LLVM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          path: llvm-project
      - name: Checkout rustc
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rust-lang/rust
          ref: main
          fetch-depth: 1
          submodules: true
          path: rust
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build zlib1g-dev libzstd-dev \
            pkg-config libssl-dev
      - name: Vendor this tree as rustc's src/llvm-project
        run: |
          rm -rf rust/src/llvm-project
          cp -a llvm-project rust/src/llvm-project
          rm -rf rust/src/llvm-project/.git
      - name: Configure rustc to build LLVM, LLD and compiler-rt from source
        run: |
          cat > rust/bootstrap.toml <<'EOF'
          [build]
          submodules = false
          optimized-compiler-builtins = true

          [llvm]
          download-ci-llvm = false
          assertions = true

          [rust]
          download-rustc = false
          lld = true
          EOF
          cat rust/bootstrap.toml
      - name: Download stage 1 toolchain
        uses: actions/download-artifact@v4
        with:
          name: rustc-stage1
          path: rust/build/host
      - name: Run codegen test suite
        run: |
          cd rust
          ./x.py test --stage 1 tests/codegen --no-fail-fast
