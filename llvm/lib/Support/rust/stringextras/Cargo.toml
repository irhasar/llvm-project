[package]
name = "llvm-stringextras"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0 WITH LLVM-exception"

[lib]
name = "llvm_stringextras"
crate-type = ["staticlib"]

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
# These short string walks do not benefit from cross-crate LTO, and LTO is the
# peak-RSS bottleneck for tiny crates.
lto = false
codegen-units = 1
